[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom"
version = "0.0.1"
description = "Deterministic, reviewable AI workflows. NL intent → IR → target runtime draft."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "click>=8.1,<9",
  "openai>=1.50,<2",
]

[project.scripts]
loom = "loom.cli.main:cli"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.4,<1",
  "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["loom"]
