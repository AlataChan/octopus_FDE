ir_version: "0.4"
metadata:
  name: Financial Market
  description: Poll market data and produce a risk-focused brief.
  owner: template-gallery
  rationale: User-facing template for scheduled market monitoring.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: [finance_market_kb]
  credentials: []
policy:
  default_timeout_s: 90
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, rate_limit]}
  agent_budget: {max_iterations: 4, max_tokens: 18000, max_wall_clock_s: 180}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: symbol, type: string, required: true}
outputs:
  - {name: quote, type: json}
  - {name: risk_brief, type: string}
nodes:
  - {id: start, type: trigger, mode: schedule, schedule: "0 * * * *", rationale: Poll market data on an hourly schedule.}
  - id: market_quote
    type: http
    method: GET
    url: https://example.invalid/fde/market/${input.symbol}/quote
    rationale: Fetch current market quote and recent movement for the symbol.
  - id: risk
    type: llm
    model: configured-small-model
    prompt: "Symbol: ${input.symbol}\nQuote: ${market_quote.body}\nSummarize risk signals without giving investment advice."
    temperature: 0.1
    output_schema:
      type: object
      properties:
        risk_brief: {type: string}
        quote: {type: object}
    rationale: Convert market data into a concise risk-focused brief.
  - id: out
    type: output
    bindings: {quote: "${risk.quote}", risk_brief: "${risk.risk_brief}"}
    rationale: Return market quote context and risk brief.
edges:
  - {from: start, to: market_quote}
  - {from: market_quote, to: risk}
  - {from: risk, to: out}
