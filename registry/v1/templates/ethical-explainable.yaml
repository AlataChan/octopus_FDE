ir_version: "0.4"
metadata:
  name: Ethical Explainable
  description: Decide with explicit explanation and guardrail routing.
  owner: template-gallery
  rationale: User-facing template for transparent decisions with safety review.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: [policy_kb]
  credentials: []
policy:
  default_timeout_s: 120
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, rate_limit]}
  agent_budget: {max_iterations: 5, max_tokens: 22000, max_wall_clock_s: 240}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
  guardrails:
    input_filters: [pii, unsafe_request]
    output_filters: [harmful_advice, unsupported_claim]
    custom_patterns: ["(?i)ignore\\s+policy"]
  escalation: {confidence_min: 0.75, confidence_from: "${decide.confidence}", handoff_node: review_out}
inputs:
  - {name: decision_context, type: string, required: true}
outputs:
  - {name: decision, type: string}
  - {name: explanation, type: string}
  - {name: route, type: string}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a decision context that needs transparent reasoning.}
  - id: decide
    type: llm
    model: configured-planner-model
    prompt: "Context: ${input.decision_context}\nMake an ethical decision, note risks, and score confidence."
    temperature: 0
    output_schema:
      type: object
      properties:
        decision: {type: string}
        confidence: {type: number}
        guardrail_flag: {type: boolean}
        risk_summary: {type: string}
    rationale: Produce a decision with confidence and guardrail signal.
  - id: explain
    type: llm
    model: configured-small-model
    prompt: "Decision: ${decide.decision}\nRisks: ${decide.risk_summary}\nExplain the reasoning in concise, auditable terms."
    temperature: 0
    output_schema:
      type: object
      properties:
        explanation: {type: string}
    rationale: Convert the decision rationale into an explainable summary.
  - id: route
    type: condition
    branches:
      - {when: "${decide.guardrail_flag} == true", next: review_out}
      - {when: "${decide.confidence} < 0.75", next: review_out}
    default: out
    rationale: Route low-confidence or guardrail-triggered decisions for handoff.
  - id: review_out
    type: output
    bindings: {decision: "${decide.decision}", explanation: "${explain.explanation}", route: review}
    rationale: Return an explanation marked for human review.
  - id: out
    type: output
    bindings: {decision: "${decide.decision}", explanation: "${explain.explanation}", route: automatic}
    rationale: Return an explainable decision for automatic use.
edges:
  - {from: start, to: decide}
  - {from: decide, to: explain}
  - {from: explain, to: route}
  - {from: route, to: review_out, when: review}
  - {from: route, to: out, when: automatic}
