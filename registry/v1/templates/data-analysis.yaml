ir_version: "0.4"
metadata:
  name: Data Analysis
  description: Compute summary statistics and interpret the result.
  owner: template-gallery
  rationale: User-facing template for lightweight analytical reports.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: []
  credentials: []
policy:
  default_timeout_s: 90
  default_retry: {max_attempts: 2, backoff: exponential, retry_on: [5xx, timeout, network]}
  agent_budget: {max_iterations: 4, max_tokens: 16000, max_wall_clock_s: 180}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: dataset_json, type: json, required: true}
outputs:
  - {name: stats, type: json}
  - {name: interpretation, type: string}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a structured dataset for analysis.}
  - id: stats
    type: code
    language: python
    source: "def main(dataset_json):\n    return {'rows': len(dataset_json) if hasattr(dataset_json, '__len__') else 1, 'summary': dataset_json}\n"
    inputs: {dataset_json: "${input.dataset_json}"}
    output_schema:
      type: object
      properties:
        rows: {type: number}
        summary: {type: object}
    rationale: Compute simple descriptive statistics from the input dataset.
  - id: interpret
    type: llm
    model: configured-small-model
    prompt: "Dataset: ${input.dataset_json}\nStats: ${stats.rows}\nWrite a concise interpretation."
    temperature: 0.1
    output_schema:
      type: object
      properties:
        interpretation: {type: string}
    rationale: Explain the computed statistics in business language.
  - id: out
    type: output
    bindings: {stats: "${stats.summary}", interpretation: "${interpret.interpretation}"}
    rationale: Return statistics and interpretation.
edges:
  - {from: start, to: stats}
  - {from: stats, to: interpret}
  - {from: interpret, to: out}
