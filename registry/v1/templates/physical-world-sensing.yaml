ir_version: "0.4"
metadata:
  name: Physical World Sensing
  description: Poll sensor data on a schedule and interpret the result.
  owner: template-gallery
  rationale: User-facing template for scheduled sensing and interpretation.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: []
  credentials: []
policy:
  default_timeout_s: 90
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, network]}
  agent_budget: {max_iterations: 4, max_tokens: 16000, max_wall_clock_s: 180}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: sensor_id, type: string, required: true}
outputs:
  - {name: reading, type: json}
  - {name: interpretation, type: string}
nodes:
  - {id: start, type: trigger, mode: schedule, schedule: "*/15 * * * *", rationale: Poll the configured sensor on a fixed schedule.}
  - id: sensor_poll
    type: http
    method: GET
    url: https://example.invalid/fde/sensors/${input.sensor_id}/latest
    rationale: Fetch the latest sensor reading.
  - id: interpret
    type: llm
    model: configured-small-model
    prompt: "Sensor: ${input.sensor_id}\nReading: ${sensor_poll.body}\nInterpret status and anomalies."
    temperature: 0.1
    output_schema:
      type: object
      properties:
        interpretation: {type: string}
        reading: {type: object}
    rationale: Interpret the latest reading and flag anomalies.
  - id: out
    type: output
    bindings: {reading: "${interpret.reading}", interpretation: "${interpret.interpretation}"}
    rationale: Return raw-like reading and interpretation.
edges:
  - {from: start, to: sensor_poll}
  - {from: sensor_poll, to: interpret}
  - {from: interpret, to: out}
