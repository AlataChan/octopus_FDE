ir_version: "0.4"
metadata:
  name: Conversational
  description: Retrieve conversation context and produce a grounded reply.
  owner: template-gallery
  rationale: User-facing template for conversational agents with context recall.
registry_ref:
  registry_version: sha:e44736a363bab7d24b565313d22a21773b826961
  tools: []
  datasets: [product_kb, policy_kb]
  credentials: []
policy:
  default_timeout_s: 90
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, rate_limit]}
  agent_budget: {max_iterations: 4, max_tokens: 18000, max_wall_clock_s: 180}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: message, type: string, required: true}
outputs:
  - {name: reply, type: string}
  - {name: citations, type: "string[]"}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept the latest user message.}
  - id: retrieve_history
    type: retrieval
    dataset: product_kb
    query: ${input.message}
    top_k: 6
    rerank: true
    rationale: Retrieve relevant prior context and knowledge snippets.
  - id: reply
    type: llm
    model: configured-planner-model
    prompt: "Message: <untrusted>${input.message}</untrusted>\nContext: <untrusted>${retrieve_history.chunks}</untrusted>\nWrite a helpful reply with citations."
    temperature: 0.3
    output_schema:
      type: object
      properties:
        reply: {type: string}
        citations: {type: array, items: {type: string}}
    rationale: Generate a concise context-aware conversational reply.
  - id: out
    type: output
    bindings: {reply: "${reply.reply}", citations: "${reply.citations}"}
    rationale: Return the reply and cited context.
edges:
  - {from: start, to: retrieve_history}
  - {from: retrieve_history, to: reply}
  - {from: reply, to: out}
