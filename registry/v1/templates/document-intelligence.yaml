ir_version: "0.4"
metadata:
  name: Document Intelligence
  description: Parse an uploaded document and extract structured fields.
  owner: template-gallery
  rationale: User-facing template for document parsing and information extraction.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: []
  credentials: []
policy:
  default_timeout_s: 120
  default_retry: {max_attempts: 2, backoff: exponential, retry_on: [5xx, timeout, network]}
  agent_budget: {max_iterations: 4, max_tokens: 18000, max_wall_clock_s: 180}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: document, type: file, required: true, description: Source document}
outputs:
  - {name: summary, type: string}
  - {name: fields, type: json}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a document upload for extraction.}
  - id: parse_doc
    type: http
    method: POST
    url: https://example.invalid/fde/document/parse
    body: {document: "${input.document}"}
    idempotency_key: ${input.document}
    rationale: Convert the document into normalized text and page metadata.
  - id: extract
    type: llm
    model: configured-small-model
    prompt: "Parsed document: ${parse_doc.body}\nExtract a summary and key fields."
    temperature: 0
    output_schema:
      type: object
      properties:
        summary: {type: string}
        fields: {type: object}
    rationale: Extract structured facts from the parsed text.
  - id: out
    type: output
    bindings: {summary: "${extract.summary}", fields: "${extract.fields}"}
    rationale: Return the document summary and extracted fields.
edges:
  - {from: start, to: parse_doc}
  - {from: parse_doc, to: extract}
  - {from: extract, to: out}
