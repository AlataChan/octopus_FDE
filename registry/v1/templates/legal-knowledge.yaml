ir_version: "0.4"
metadata:
  name: Legal Knowledge
  description: Retrieve case-law knowledge and produce a cited legal reasoning note.
  owner: template-gallery
  rationale: User-facing template for legal knowledge retrieval and reasoning.
registry_ref:
  registry_version: sha:e44736a363bab7d24b565313d22a21773b826961
  tools: []
  datasets: [legal_case_law_kb]
  credentials: []
policy:
  default_timeout_s: 120
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, rate_limit]}
  agent_budget: {max_iterations: 4, max_tokens: 22000, max_wall_clock_s: 240}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: legal_question, type: string, required: true}
outputs:
  - {name: answer, type: string}
  - {name: citations, type: chunks}
  - {name: caveat, type: string}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a legal knowledge question.}
  - id: retrieve_cases
    type: retrieval
    dataset: legal_case_law_kb
    query: ${input.legal_question}
    top_k: 8
    rerank: true
    rationale: Retrieve relevant case-law passages before reasoning.
  - id: reason
    type: llm
    model: configured-small-model
    prompt: "Question: <untrusted>${input.legal_question}</untrusted>\nCase law: <untrusted>${retrieve_cases.chunks}</untrusted>\nExplain relevant legal reasoning and include a non-advice caveat."
    temperature: 0
    output_schema:
      type: object
      properties:
        answer: {type: string}
        caveat: {type: string}
    rationale: Generate a grounded legal knowledge note with clear caveat.
  - id: out
    type: output
    bindings: {answer: "${reason.answer}", citations: "${retrieve_cases.chunks}", caveat: "${reason.caveat}"}
    rationale: Return the legal knowledge note and supporting citations.
edges:
  - {from: start, to: retrieve_cases}
  - {from: retrieve_cases, to: reason}
  - {from: reason, to: out}
