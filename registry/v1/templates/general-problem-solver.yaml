ir_version: "0.4"
metadata:
  name: General Problem Solver
  description: Decompose a problem, solve each step, and synthesize the result.
  owner: template-gallery
  rationale: User-facing template for broad stepwise problem solving.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: []
  credentials: []
policy:
  default_timeout_s: 180
  default_retry: {max_attempts: 2, backoff: exponential, retry_on: [5xx, timeout, network]}
  agent_budget: {max_iterations: 10, max_tokens: 30000, max_wall_clock_s: 300}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: problem, type: string, required: true}
outputs:
  - {name: steps, type: json}
  - {name: answer, type: string}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a general problem statement.}
  - id: decompose
    type: llm
    model: configured-planner-model
    prompt: "Problem: ${input.problem}\nReturn a short ordered list of solution steps."
    output_schema:
      type: object
      properties:
        steps: {type: array, items: {type: string}}
    rationale: Break the problem into bounded solution steps.
  - id: solve
    type: loop
    over: ${decompose.steps}
    as: step
    max_iterations: 8
    body:
      - id: solve_step
        type: llm
        model: configured-small-model
        prompt: "Problem: ${input.problem}\nStep: ${solve.step}\nSolve this step."
        output_schema:
          type: object
          properties:
            result: {type: string}
        rationale: Solve one decomposed step.
    rationale: Iterate through each planned step with a cap.
  - id: synthesize
    type: llm
    model: configured-planner-model
    prompt: "Problem: ${input.problem}\nStep results: ${solve.results}\nWrite the final answer."
    output_schema:
      type: object
      properties:
        answer: {type: string}
    rationale: Combine step results into one final answer.
  - id: out
    type: output
    bindings: {steps: "${decompose.steps}", answer: "${synthesize.answer}"}
    rationale: Return the step plan and final answer.
edges:
  - {from: start, to: decompose}
  - {from: decompose, to: solve}
  - {from: solve, to: synthesize}
  - {from: synthesize, to: out}
