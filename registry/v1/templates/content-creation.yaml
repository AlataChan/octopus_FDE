ir_version: "0.4"
metadata:
  name: Content Creation
  description: Draft content, review it, and return a polished version.
  owner: template-gallery
  rationale: User-facing template for controlled content production.
registry_ref:
  registry_version: sha:e44736a363bab7d24b565313d22a21773b826961
  tools: []
  datasets: []
  credentials: []
policy:
  default_timeout_s: 120
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, rate_limit]}
  agent_budget: {max_iterations: 4, max_tokens: 20000, max_wall_clock_s: 220}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: brief, type: string, required: true}
  - {name: channel, type: string, required: true}
outputs:
  - {name: draft, type: string}
  - {name: final, type: string}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a content brief and target channel.}
  - id: draft
    type: llm
    model: configured-planner-model
    prompt: "Brief: <untrusted>${input.brief}</untrusted>\nChannel: <untrusted>${input.channel}</untrusted>\nDraft channel-ready content."
    temperature: 0.6
    output_schema:
      type: object
      properties:
        draft: {type: string}
    rationale: Create the first content draft for the target channel.
  - id: review
    type: llm
    model: configured-small-model
    prompt: "Brief: <untrusted>${input.brief}</untrusted>\nDraft: ${draft.draft}\nReview and return a polished final version."
    temperature: 0.2
    output_schema:
      type: object
      properties:
        final: {type: string}
        review_notes: {type: string}
    rationale: Improve clarity, fit, and consistency before output.
  - id: out
    type: output
    bindings: {draft: "${draft.draft}", final: "${review.final}"}
    rationale: Return the draft and polished final content.
edges:
  - {from: start, to: draft}
  - {from: draft, to: review}
  - {from: review, to: out}
