ir_version: "0.4"
metadata:
  name: Recommendation
  description: Retrieve catalog candidates and score recommendations.
  owner: template-gallery
  rationale: User-facing template for catalog-based recommendation flows.
registry_ref:
  registry_version: sha:0000000
  tools: []
  datasets: [product_kb]
  credentials: []
policy:
  default_timeout_s: 90
  default_retry: {max_attempts: 3, backoff: exponential, retry_on: [5xx, timeout, rate_limit]}
  agent_budget: {max_iterations: 4, max_tokens: 18000, max_wall_clock_s: 180}
  audit: {log_inputs: false, log_decisions: true, retention_days: 90}
inputs:
  - {name: user_need, type: string, required: true}
outputs:
  - {name: recommendations, type: json}
  - {name: explanation, type: string}
nodes:
  - {id: start, type: trigger, mode: manual, rationale: Accept a user need for recommendation.}
  - id: retrieve_catalog
    type: retrieval
    dataset: product_kb
    query: ${input.user_need}
    top_k: 10
    rerank: true
    rationale: Retrieve candidate catalog items matching the need.
  - id: score
    type: llm
    model: configured-small-model
    prompt: "Need: ${input.user_need}\nCandidates: ${retrieve_catalog.chunks}\nScore and rank recommendations."
    temperature: 0.1
    output_schema:
      type: object
      properties:
        recommendations: {type: array, items: {type: object}}
        explanation: {type: string}
    rationale: Score candidate items and explain the ranking.
  - id: out
    type: output
    bindings: {recommendations: "${score.recommendations}", explanation: "${score.explanation}"}
    rationale: Return ranked recommendations and explanation.
edges:
  - {from: start, to: retrieve_catalog}
  - {from: retrieve_catalog, to: score}
  - {from: score, to: out}
